<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看懂經濟 Economics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a patient teacher; clear, calm, logical — every fact earns its place by a "because".
   IDEA: a museum timeline wall paired with an atlas — walk the wall, follow the string to the next event.
   PICTURE: the era timeline with icon pins, plus a world map whose arcs show what each event caused.
   COLOUR and TYPE: lapis-blue band (map ink) on white, vermilion for cause arrows; one colour per era. Noto Sans TC + Archivo.
   LAYOUT: band with title + timeline; below, cause-effect card left, map + think-about-it right; stacks under 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d111c);--ink:light-dark(#141821,#e7eaf2);--mute:light-dark(#5b6272,#9aa3b5);
--line:light-dark(#e3e6ee,#232a3b);--soft:light-dark(#f4f6fb,#151b2b);--lap:light-dark(#1b3fb8,#1a2f80);
--lapink:#ffffff;--ver:light-dark(#d43d2a,#ff6b55);--sea:light-dark(#eef2fb,#111830);--landc:light-dark(#cfd7e8,#2a3552)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","Archivo",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ver);outline-offset:2px}
.band{padding:clamp(24px,3.5vw,48px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.top{background:var(--lap);color:var(--lapink)}
.hd{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
h1{font:900 clamp(32px,5vw,50px)/1.05 "Noto Sans TC",sans-serif;margin:0;text-wrap:balance}
h1 small{display:block;font:700 clamp(17px,2vw,22px)/1.3 Archivo,sans-serif;opacity:.85;margin-top:8px}
.sub{max-width:62ch;opacity:.9;margin:12px 0 0}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.seg button{border:0;background:none;color:#fff;padding:8px 14px;border-radius:999px;min-height:40px;font-size:15px}
.seg button[aria-pressed=true]{background:#fff;color:#1b3fb8;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{border:1.5px solid rgba(255,255,255,.55);background:none;color:#fff;border-radius:999px;padding:7px 14px;min-height:40px;font-size:15px}
.chip[aria-pressed=true]{background:#fff;color:#1b3fb8;border-color:#fff;font-weight:700}
.tl{margin-top:22px;background:var(--bg);color:var(--ink);border-radius:18px;overflow-x:auto;box-shadow:0 10px 30px rgba(0,0,30,.25)}
.tlin{display:grid;grid-template-columns:repeat(8,minmax(140px,1fr));min-width:1120px}
.era{border-right:1px solid var(--line);padding:14px 10px 12px;position:relative}
.era:last-child{border-right:0}
.era h3{margin:0;font:700 14px/1.3 "Noto Sans TC",sans-serif;color:var(--ec)}.era h3 .en{display:block;font-weight:600}
.era .yr{font:500 13px Archivo,sans-serif;color:var(--mute)}
.era .bar{height:6px;border-radius:3px;background:var(--ec);margin:10px 0 0}
.lane{position:relative;height:200px}
.pin{position:absolute;transform:translateX(-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:52px}
.pin .ic{width:38px;height:38px;border-radius:50%;background:var(--bg);border:2px solid var(--ec);color:var(--ec);display:grid;place-items:center;transition:transform .2s}
.pin svg{width:20px;height:20px}
.pin .py{font:700 12px Archivo,sans-serif;white-space:nowrap;color:var(--mute)}
.pin.on .ic{background:var(--ec);color:#fff;transform:scale(1.18)}
.pin.on .py{color:var(--ink)}
.pin.dim{opacity:.18}
main .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px}
@media(max-width:900px){main .grid{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2.5vw,28px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--mute);font-size:14px}
.tag{color:#fff;background:var(--ec);border-radius:6px;padding:2px 10px;font-weight:700}
.bigyr{font:800 clamp(34px,5vw,48px)/1 Archivo,sans-serif;color:var(--ec);margin:14px 0 4px}
h2{margin:0;font:900 clamp(26px,3.2vw,34px)/1.15 "Noto Sans TC",sans-serif;text-wrap:balance}
h2 .en{display:block;font:700 .62em/1.3 Archivo,sans-serif;color:var(--mute);margin-top:4px}
.flow{margin-top:22px;display:grid;gap:0}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start}
.step .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--ec)}
.step .n svg{width:22px;height:22px}
.step b{display:block;font-size:15px}
.step b i{font-style:normal;color:var(--mute);font-weight:500;font-family:Archivo,sans-serif;margin-left:6px}
.step p{margin:2px 0 0}
.arr{margin:4px 0 4px 21px;width:2px;height:22px;background:var(--ver);position:relative}
.arr::after{content:"";position:absolute;bottom:-2px;left:-5px;border:6px solid transparent;border-top:8px solid var(--ver);border-bottom:0}
.because{font-size:13px;color:var(--ver);font-weight:700;margin:-20px 0 0 36px;height:20px}
.en{font-family:Archivo,"Noto Sans TC",sans-serif}.zh+.en{margin-left:.35em}h2 .en,.era h3 .en,p .en,li .en,.box .en,.q .en,.mapcap .en{margin-left:0!important}.mapcap .en{display:block}
p .en,li .en,.box .en{display:block;color:var(--mute);font-size:15px;line-height:1.5}
body.lz .en{display:none!important}body.le .zh{display:none!important}
body.le p .en,body.le li .en,body.le .box .en{color:var(--ink);font-size:16px}
body.le h2 .en{font-size:1em;color:var(--ink)}
.box{margin-top:20px;border-radius:14px;padding:16px 18px;background:var(--soft)}
.box h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center}
.box h4 svg{width:20px;height:20px;color:var(--ec)}
.box p{margin:0}
.links{margin-top:20px;display:grid;gap:10px}
.links .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.links .lb{font-size:14px;color:var(--mute);width:128px;flex:none}
.go{border:1.5px solid var(--ec);color:var(--ink);background:none;border-radius:999px;padding:6px 12px;min-height:40px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.go:hover{background:var(--soft)}
.go em{font-style:normal;font-family:Archivo;font-weight:700;color:var(--ec)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.nav button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 16px;min-height:44px}
.side{display:grid;gap:22px;align-content:start}
.mapbox{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto}
.mapcap{padding:10px 14px;font-size:14px;color:var(--mute);border-top:1px solid var(--line);background:var(--bg)}
.mk{cursor:pointer}.osl{font:600 22px Archivo,sans-serif;fill:var(--mute)}
.pulse{animation:pl 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.35}.pin .ic{transition:none}}
.think{border-radius:18px;padding:20px;background:var(--ec);color:#fff}
.think h4{margin:0 0 6px;font-size:15px;opacity:.9}
.think .q{font-weight:700;font-size:18px;line-height:1.45}
.think .q .en{display:block;color:rgba(255,255,255,.85);font-size:15px;font-weight:500}
.think button{margin-top:12px;background:#fff;color:#141821;border:0;border-radius:10px;padding:9px 16px;min-height:44px;font-weight:700}
.think .ans{margin-top:12px;background:rgba(0,0,0,.18);border-radius:12px;padding:12px 14px}
.think .ans p{margin:0}.think .ans .en{color:rgba(255,255,255,.85)!important}
.p2p{border:2px dashed var(--ec);border-radius:18px;padding:18px 20px}
.p2p h4{margin:0;font-size:16px}
.p2p .lead{margin:6px 0 12px}
.tmpl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:6px 0 14px}
.tmpl div{position:relative;border:1.5px solid var(--mute);border-radius:10px;min-height:62px;padding:6px;font-size:12px;color:var(--mute);text-align:center}
.tmpl div:not(:last-child)::after{content:"→";position:absolute;right:-16px;top:18px;color:var(--ver);font-weight:900}
.p2p ol{margin:0;padding-left:20px;font-size:15px}
.p2p li{margin:3px 0}
footer{color:var(--mute);font-size:13px}
@media(max-width:600px){.links .lb{width:100%}.tmpl{gap:14px}.tmpl div{font-size:11px;min-height:54px}}
</style>
</head>

<header class="band top"><div class="wrap">

  <div>
   <h1>看懂經濟<small>Economics, Understood</small></h1>
   <p class="sub">不背定義，用真實事件看懂經濟原理。每個概念都是一條因果鏈：背景 → 事件 → 結果 → 長期影響。<br><span style="opacity:.85">Skip memorizing definitions; learn each economic idea through a real event and its causes and effects.</span></p>

</div></header>

const ERAS=[
{c:'#9a6b2f',n:['稀缺與選擇','Scarcity & Choice'],s:1776,e:1913,std:'12.1',
 q:['為什麼「免費」的東西其實都有成本？','Why does nothing that is "free" actually come without a cost?'],
 a:['因為資源（時間、錢、注意力）有限，選了一樣就放棄另一樣，被放棄的最好選項就是「機會成本」。免費的演唱會門票，成本是你那晚可以去打工賺的錢或準備考試的時間。','Resources like time, money and attention are limited, so choosing one thing means giving up another. The best option you give up is the opportunity cost. A free concert ticket still costs the shift you could have worked or the study time you lost.']},
{c:'#d43d2a',n:['供給與需求','Supply & Demand'],s:1973,e:2024,std:'12.2',
 q:['政府規定價格不能漲，為什麼常常反而讓人買不到東西？','When government caps a price, why do people often end up unable to buy it?'],
 a:['價格是訊號：價格上漲會讓買的人少買、賣的人多賣。如果硬把價格壓在市場價以下（價格上限），需求量大於供給量，就會出現排隊和短缺。1973 年的加油站長龍就是例子。','Prices are signals: higher prices make buyers buy less and sellers sell more. Holding a price below the market level (a price ceiling) makes quantity demanded exceed supply, causing lines and shortages, as in the 1973 gas lines.']},
{c:'#55606e',n:['市場結構與競爭','Competition & Monopoly'],s:1900,e:2024,std:'12.2',
 q:['一家公司做得太好、規模太大，為什麼政府要管？','If a company becomes very successful and huge, why would government step in?'],
 a:['競爭讓公司必須降價、創新來搶客人。一旦變成壟斷，沒有對手，就可以抬高價格、降低品質、擋住新公司。但大公司也可能因為規模更有效率，所以要拆不拆一直是辯論。','Competition forces firms to cut prices and innovate. A monopoly with no rivals can raise prices, let quality slip and block newcomers. But size can also bring efficiency, so whether to break up a firm is always debated.']},
{c:'#c26a00',n:['政府在市場的角色','Government & Markets'],s:1906,e:1970,std:'12.3',
 q:['市場這麼有效率，為什麼還需要政府？','If markets are so efficient, why do we need government at all?'],
 a:['市場有幾種「失靈」：外部性（工廠污染，成本由別人承擔）、公共財（道路、國防，沒人願意單獨付錢）、資訊不對稱（買家不知道食品安不安全）。這時政府介入可以讓結果更好，但政府也可能管過頭。','Markets fail in a few ways: externalities (a factory\'s pollution costs others), public goods (roads, defense; nobody pays alone) and information gaps (buyers can\'t tell if food is safe). Government action can help, though it can also overreach.']},
{c:'#7a2f8f',n:['勞動市場','Labor Markets'],s:1937,e:2025,std:'12.4',
 q:['為什麼不同工作的薪水差這麼多？','Why do some jobs pay so much more than others?'],
 a:['薪水也是價格，由勞動的供給和需求決定。需要稀有技能、生產力高、很多公司搶人的工作，薪水高；誰都能做、人很多的工作，薪水低。教育（人力資本）、工會、最低工資、科技變化都會改變這個平衡。','Wages are prices set by the supply and demand for labor. Jobs needing rare, productive skills that many employers want pay more; jobs many people can do pay less. Education (human capital), unions, minimum wages and technology all shift the balance.']},
{c:'#263043',n:['總體經濟','Macroeconomics'],s:1929,e:2022,std:'12.5',
 q:['經濟衰退時，政府可以做什麼？有什麼代價？','In a recession, what can government do, and what does it cost?'],
 a:['財政政策（國會）：減稅、增加支出，讓大家有錢消費；代價是國債增加。貨幣政策（聯準會）：降息，讓借錢變便宜；代價是可能帶來通膨或泡沫。兩種工具都要找平衡。','Fiscal policy (Congress): cut taxes or spend more so people can buy; the cost is more national debt. Monetary policy (the Fed): lower interest rates to make borrowing cheap; the cost can be inflation or bubbles. Both need balance.']},
{c:'#1a7f8e',n:['貨幣與聯準會','Money & the Fed'],s:1913,e:1971,std:'12.5',
 q:['政府直接印很多錢發給大家，為什麼不會讓大家變有錢？','If the government printed lots of money and handed it out, why wouldn\'t everyone get rich?'],
 a:['錢只是交換的工具，真正的財富是商品和服務。錢變多但東西沒變多，大家搶同樣多的東西，價格就上漲（通貨膨脹），每張鈔票能買的東西變少。1923 年的德國是極端例子。','Money is a tool for exchange; real wealth is goods and services. More money chasing the same goods pushes prices up (inflation), so each bill buys less. Germany in 1923 is the extreme case.']},
{c:'#2c8a4b',n:['國際經濟','The Global Economy'],s:1817,e:2025,std:'12.6',
 q:['自由貿易讓整體變得更富有，為什麼關稅一直有人支持？','If free trade makes countries richer overall, why do tariffs keep getting support?'],
 a:['貿易的好處分散（每個消費者省一點錢），損失卻集中（某個產業的工人失業），失去的人更有動力發聲。支持者也提出國家安全、保護新興產業、談判籌碼等理由；反對者指出關稅最後多由國內消費者和企業負擔。','Trade\'s gains are spread thin (each shopper saves a little) while losses are concentrated (one industry\'s workers lose jobs), and the losers are more motivated to speak up. Supporters also cite national security, infant industries and bargaining leverage; critics note tariffs are largely paid by domestic buyers and firms.']}
];

const EV=[
{id:'smith',era:0,y:'1776',yr:1776,ic:'book',t:['亞當·斯密《國富論》','Adam Smith\'s Wealth of Nations'],pl:['蘇格蘭','Scotland'],loc:[-3.19,55.95],th:['choice','market'],to:['ford','ricardo'],
c:['當時主流的「重商主義」認為國家財富就是囤積金銀，政府要嚴格控制貿易。','Mercantilism held that wealth meant hoarding gold and silver under tight government control of trade.'],
a:['斯密提出：分工能大幅提高生產力；每個人追求自己的利益，透過市場競爭，像「看不見的手」一樣讓社會整體受益。','Smith argued that division of labor multiplies productivity, and people pursuing their own interest through competitive markets benefit society, as if by an "invisible hand."'],
r:['財富的定義從「金銀」變成「生產商品和服務的能力」。','Wealth was redefined from gold to the capacity to produce goods and services.'],
l:['成為市場經濟和自由貿易的理論基礎。','It became the foundation of market economics and free trade.'],
d:['麵包店老闆早起烤麵包，不是因為愛你，而是為了賺錢，但你也因此吃到早餐。','The baker rises early not out of love for you but to earn a living, and you still get breakfast.'],
p:['畫一隻「看不見的手」：買家、賣家各自的利益，最後匯成市場價格。','Draw the invisible hand: buyers\' and sellers\' self-interest meeting at a market price.']},
{id:'goldrush',era:0,y:'1849',yr:1849,ic:'up',t:['淘金熱：稀缺與誘因','The Gold Rush: Scarcity & Incentives'],pl:['舊金山','San Francisco'],loc:[-122.42,37.77],th:['choice','market'],to:['oilcrisis'],

a:['三十萬人湧入加州；但大多數淘金者沒發財，賣鏟子、牛仔褲、食物的商人（例如李維·史特勞斯）反而賺最多。','About 300,000 people rushed in; most miners didn\'t get rich, while merchants selling shovels, jeans and food (like Levi Strauss) profited most.'],

p:['畫供需圖：礦區的蛋，人突然變多時需求線往右移，價格怎麼變？','Draw supply and demand for eggs in a mining town: as people pour in, demand shifts right. What happens to price?']},
{id:'ford',era:0,y:'1913',yr:1913,ic:'factory',t:['福特生產線：生產力','Ford\'s Assembly Line'],pl:['底特律','Detroit'],loc:[-83.05,42.33],th:['choice','market'],to:['uaw'],
c:['汽車手工製造很貴，只有富人買得起。','Hand-built cars were expensive, a luxury for the rich.'],
a:['福特採用移動式生產線：每個工人只做一個步驟（分工），組裝一台車從 12 小時縮短到約 1.5 小時。','Ford\'s moving assembly line gave each worker one task (division of labor), cutting assembly time from about 12 hours to about 1.5.'],
r:['T 型車價格大降；福特又把日薪提高到 5 美元，留住工人。','Model T prices fell sharply; Ford raised pay to $5 a day to keep workers.'],
l:['大量生產讓一般家庭買得起汽車，開啟消費社會。','Mass production put cars within reach of ordinary families and launched consumer society.'],
d:['像做三明治：一人全包要 5 分鐘，五人分工每人負責一步，產量多好幾倍。','Like making sandwiches: one person doing everything takes 5 minutes; five people each doing one step make many more.'],
p:['畫生產線：每個工作站一個步驟，比較「一人全做」和「分工」的產量。','Draw a line of work stations and compare output: one person doing it all vs division of labor.']},
{id:'oilcrisis',era:1,y:'1973',yr:1973,ic:'chart',t:['石油危機與加油站長龍','The Oil Crisis & Gas Lines'],pl:['洛杉磯','Los Angeles'],loc:[-118.24,34.05],th:['market','gov'],to:['volcker'],
c:['中東石油輸出國對美國實施禁運，石油供給突然減少；美國當時有價格管制。','Middle Eastern oil exporters embargoed the U.S., cutting supply, while U.S. price controls were in place.'],
a:['供給減少本該讓油價上漲到新平衡，但價格管制讓油價無法完全反映，結果全國加油站大排長龍。','Lower supply should have raised prices to a new balance, but controls held them down, so lines stretched outside gas stations nationwide.'],
r:['出現短缺、單雙號加油、恐慌搶購。','Shortages, odd–even rationing and panic buying followed.'],
l:['推動省油汽車、能源政策；價格管制後來在 1981 年取消。','It spurred fuel-efficient cars and energy policy; oil price controls ended in 1981.'],
d:['熱門演唱會票價被規定很低，結果只有排最久的人買得到，其他人去找黃牛。','Like capping prices for hit concert tickets: only the longest line gets them and everyone else turns to scalpers.'],
p:['畫供需圖，在均衡價下方畫一條「價格上限」，標出短缺的缺口。','Draw supply and demand, add a price ceiling below equilibrium and mark the shortage gap.']},
{id:'pandemic',era:1,y:'2020',yr:2020,ic:'chart',t:['疫情搶購與供應鏈','Pandemic Panic Buying'],pl:['全美','Nationwide'],loc:[-104.99,39.74],th:['market','macro'],to:['inflation22'],

r:['短期缺貨、價格上漲。','Short-term shortages and price spikes.'],
l:['企業開始重視供應鏈韌性，部分生產移回國內或分散到多國。','Firms began prioritizing resilient supply chains, moving some production home or spreading it across countries.'],
d:['分析題：衛生紙其實沒有變少，為什麼還是買不到？（提示：需求的預期）','Analysis: there wasn\'t actually less toilet paper. Why couldn\'t you buy any? (Hint: expectations.)'],
p:['畫兩張供需圖：一張需求右移（搶購），一張供給左移（供應鏈）。','Draw two graphs: demand shifting right (panic buying) and supply shifting left (supply chains).']},
{id:'housing',era:1,y:'2010s–today',yr:2018,ic:'temple',t:['加州房價：供給不足','California Housing Costs'],pl:['舊金山灣區','Bay Area'],loc:[-122.27,37.8],th:['market','gov'],to:[],
c:['工作機會吸引大量人口（需求高），但嚴格的土地使用規定、審批流程讓新房子蓋得很慢（供給低）。','Jobs drew many people (high demand), while strict zoning and slow permitting limited new construction (low supply).'],

p:['畫供需圖：需求右移，但供給線很陡（很難增加），價格會怎樣？','Draw supply and demand with a steep supply curve: demand rises; what happens to price?']},
{id:'standardoil',era:2,y:'1911',yr:1911,ic:'factory',t:['拆分標準石油：壟斷','Breaking Up Standard Oil'],pl:['俄亥俄州克里夫蘭','Cleveland, OH'],loc:[-81.69,41.5],th:['market','gov'],to:['att','google'],

a:['政府依《謝爾曼反托拉斯法》起訴；最高法院下令拆成 34 家公司。','The government sued under the Sherman Antitrust Act, and the Supreme Court ordered it split into 34 companies.'],
r:['恢復石油產業的競爭。','Competition returned to the oil industry.'],
l:['確立政府可以阻止壟斷的先例；今天的 ExxonMobil、Chevron 都源自它。','It set the precedent that government can break monopolies; ExxonMobil and Chevron descend from it.'],
d:['像校內只有一家福利社，價格它說了算；開放第二家後，價格就得下降。','Like a school with one snack shop setting any price until a second one opens.'],
p:['畫市場結構光譜：完全競爭 → 獨占性競爭 → 寡占 → 獨占，各放一個例子。','Draw the spectrum: perfect competition → monopolistic competition → oligopoly → monopoly, with an example of each.']},
{id:'att',era:2,y:'1984',yr:1984,ic:'globe',t:['拆分 AT&T：開放競爭','Breaking Up AT&T'],pl:['紐約','New York'],loc:[-74.0,40.71],th:['market','gov'],to:[],
c:['AT&T 長期是政府允許的電話「自然獨占」，消費者只能跟它租電話。','AT&T was a government-approved natural monopoly in phone service; customers even had to rent its phones.'],
a:['政府反壟斷訴訟後，AT&T 在 1984 年拆分為長途電話公司和 7 家地區電話公司。','After an antitrust suit, AT&T was split in 1984 into a long-distance firm and seven regional companies.'],

{id:'google',era:2,y:'2024',yr:2024,ic:'gear',t:['科技平台與反壟斷','Big Tech & Antitrust'],pl:['加州山景城','Mountain View, CA'],loc:[-122.08,37.42],th:['market','gov'],to:[],
c:['少數科技平台在搜尋、社群、應用程式商店等領域占有極大市占率；用戶越多，服務越好（網路效應）。','A few platforms dominate search, social media and app stores; more users make the service better (network effects).'],
a:['2024 年聯邦法院判決 Google 在網路搜尋市場違法維持獨占；其他科技公司也面臨反壟斷訴訟。','In 2024 a federal court ruled that Google illegally maintained a monopoly in search; other tech giants also face antitrust suits.'],

d:['你用的搜尋、地圖、影片平台都免費，那你付出的「價格」是什麼？（提示：資料與注意力）','Your search, maps and video apps are free. What price do you pay? (Hint: data and attention.)'],
p:['畫網路效應的循環：使用者多 → 服務好 → 更多使用者 → 對手難進入。','Draw the network-effect loop: more users → better service → more users → rivals locked out.']},
{id:'fda',era:3,y:'1906',yr:1906,ic:'doc',t:['純淨食品藥物法','Pure Food and Drug Act'],pl:['芝加哥','Chicago'],loc:[-87.6,41.88],th:['gov'],to:['epa'],

a:['國會通過《純淨食品藥物法》和《肉品檢驗法》，後來發展成 FDA。','Congress passed the Pure Food and Drug Act and the Meat Inspection Act, the roots of the FDA.'],

{id:'highway',era:3,y:'1956',yr:1956,ic:'map',t:['州際高速公路：公共財','Interstate Highways: Public Goods'],pl:['全美','Nationwide'],loc:[-98.5,39.5],th:['gov','macro'],to:[],

a:['艾森豪總統推動《聯邦公路法》，由政府用燃油稅蓋超過 6 萬公里的州際公路。','Eisenhower\'s Federal-Aid Highway Act used fuel taxes to build over 40,000 miles of interstates.'],

{id:'epa',era:3,y:'1969–1970',yr:1970,ic:'sun',t:['河流著火與環保署：外部性','A Burning River & the EPA'],pl:['俄亥俄州克里夫蘭','Cleveland, OH'],loc:[-81.4,41.3],th:['gov'],to:[],
c:['工廠把廢料排進河裡，自己不用付清理成本，成本落在社會身上（負外部性）。','Factories dumped waste into rivers without paying the cleanup cost, pushing it onto society (a negative externality).'],
a:['1969 年凱霍加河上的油污著火；1970 年成立環保署（EPA），通過《清潔空氣法》。','In 1969 oil on the Cuyahoga River caught fire; in 1970 the EPA was created and the Clean Air Act passed.'],

d:['鄰居半夜開派對很吵，好處他享受，代價你承擔，這就是外部性。','A neighbor\'s late-night party: he enjoys it, you pay in lost sleep. That\'s an externality.'],
p:['畫一張圖：工廠 → 產品（工廠得利）+ 煙（別人付代價），用不同顏色標出誰得利、誰受害。','Draw a factory making products (its gain) and smoke (others\' cost); color who benefits and who pays.']},
{id:'uaw',era:4,y:'1936–1937',yr:1937,ic:'factory',t:['弗林特靜坐罷工：工會','Flint Sit-Down Strike'],pl:['密西根州弗林特','Flint, MI'],loc:[-83.69,43.01],th:['market','gov'],to:['flsa'],

{id:'flsa',era:4,y:'1938',yr:1938,ic:'doc',t:['最低工資與 40 小時工時','Minimum Wage & the 40-Hour Week'],pl:['華盛頓','Washington, D.C.'],loc:[-77.03,38.9],th:['gov','market'],to:[],

a:['《公平勞動標準法》訂定全國最低工資（每小時 25 美分）、每週 40 小時工時與加班費，並限制童工。','The Fair Labor Standards Act set a national minimum wage (25¢ an hour), a 40-hour week with overtime, and limits on child labor.'],

 const yr=`${er.s}–${i===7?'today':er.e}`;
 return `<div class="era" style="--ec:${er.c}"><h3>${b(er.n)}</h3><div class="yr">${yr} · ${er.std}</div><div class="bar"></div><div class="lane">${pins}</div></div>`}).join('');

function linkBtns(ids){return ids.length?ids.map(id=>{const e=BY[id];return `<button class="go" data-id="${id}" style="--ec:${ERAS[e.era].c}"><em>${e.y}</em>${b(e.t)}</button>`}).join(''):'<span style="color:var(--mute);font-size:14px">—</span>'}

function render(){
 const e=BY[cur],er=ERAS[e.era];
 document.documentElement.style.setProperty('--ec',er.c);
 const steps=[['doc','背景與問題','Background',e.c,'因為 because'],['flag','關鍵事件','Event',e.a,'所以 so'],['up','直接結果','Result',e.r,'長期來看 over time'],['globe','長期影響','Long-term impact',e.l,'']];
 $('#card').innerHTML=`<div class="meta"><span class="tag">${b(er.n)}</span><span>${b(e.pl)}</span><span>CA HSS ${er.std}</span></div>
 <div class="bigyr">${e.y}</div><h2>${e.t[0]}<span class="en">${e.t[1]}</span></h2>
 <div class="flow">${steps.map((s,i)=>`<div class="step"><div class="n">${svg(s[0])}</div><div><b>${s[1]}<i>${s[2]}</i></b><p>${b(s[3])}</p></div></div>${i<3?`<div class="arr"></div><div class="because">${s[4]}</div>`:''}`).join('')}</div>
 <div class="box"><h4>${svg('bulb')}<span>生活類比 · Everyday link</span></h4><p>${b(e.d)}</p></div>
 <div class="links"><div class="row"><span class="lb">← 前因 Came from</span>${linkBtns(FROM[cur]||[])}</div><div class="row"><span class="lb">→ 引發 Led to</span>${linkBtns(e.to)}</div></div>
 <div class="nav"><button id="prev">← 上一個 Prev</button><button id="next">下一個 Next →</button></div>`;
 $('#think').innerHTML=`<h4>想一想 · Think about it — ${b(er.n)}</h4><div class="q">${b(er.q)}</div><button id="rev" aria-expanded="false">看分析 Show reasoning</button><div class="ans" hidden><p>${b(er.a)}</p></div>`;
 $('#p2p').innerHTML=`<h4>Picture to Pencil · 畫出因果</h4><p class="lead">${b(e.p)}</p>
 <div class="tmpl"><div>背景<br>Cause</div><div>事件<br>Event</div><div>結果<br>Result</div><div>影響<br>Impact</div></div>
 <ol><li>${b(['每個箭頭都能說成「因為…所以…」嗎？','Can every arrow be read as "because… so…"?'])}</li><li>${b(['至少找出兩個原因，不只一個。','Find at least two causes, not one.'])}</li><li>${b(['用一句話向同學解釋你的圖。','Explain your drawing to a classmate in one sentence.'])}</li></ol>`;
 document.querySelectorAll('.pin').forEach(p=>{p.classList.toggle('on',p.dataset.id===cur);p.classList.toggle('dim',!!filt&&!BY[p.dataset.id].th.includes(filt))});
 drawMap();
 const n=e.to.length;
 $('#mapcap').innerHTML=b([`${e.pl[0]}。${n?`紅線：這件事影響了 ${n} 個後續事件。`:'這是一條因果鏈的終點（目前）。'}點地圖上的點可跳轉。`,`${e.pl[1]}. ${n?`Red arcs: this led to ${n} later event${n>1?'s':''}.`:'End of this chain (for now).'} Tap a dot to jump.`]);
}
function drawMap(){
 const e=BY[cur],[x0,y0]=XY[cur];
 $('#arcs').innerHTML=[...e.to.map(id=>[id,'var(--ver)']),...(FROM[cur]||[]).map(id=>[id,'var(--mute)'])].map(([id,col])=>{
  const [x1,y1]=XY[id];const mx=(x0+x1)/2,my=Math.min(y0,y1)-Math.max(30,Math.abs(x1-x0)*.25);
  return `<path d="M${x0},${y0} Q${mx},${my} ${x1},${y1}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="${col==='var(--ver)'?'0':'5 4'}"/>`}).join('');
 $('#mks').innerHTML=EV.map(v=>{const [x,y,os]=XY[v.id],on=v.id===cur,c=ERAS[v.era].c,dim=filt&&!v.th.includes(filt);
  return `<g class="mk" data-id="${v.id}" opacity="${dim?.2:1}"><title>${v.y} ${v.t[0]} ${v.t[1]}</title>${on?`<circle cx="${x}" cy="${y}" r="9" fill="${c}" class="pulse"/>`:''}${os?`<rect x="${x-(on?8:6)}" y="${y-(on?8:6)}" width="${on?16:12}" height="${on?16:12}" transform="rotate(45 ${x} ${y})" fill="${c}" stroke="#fff" stroke-width="1.5"/>`:`<circle cx="${x}" cy="${y}" r="${on?8:5}" fill="${c}" stroke="#fff" stroke-width="1.5"/>`}<circle cx="${x}" cy="${y}" r="14" fill="transparent"/></g>`}).join('');
}
const order=[...EV].sort((a,b)=>a.era-b.era||a.yr-b.yr).map(e=>e.id);
function go(id){if(!BY[id])return;cur=id;render();try{history.replaceState(null,'','#'+id)}catch(_){}}
function step(d){const i=order.indexOf(cur);go(order[(i+d+order.length)%order.length])}

document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-id]');if(t){go(t.dataset.id);if(t.classList.contains('go')||t.classList.contains('mk')||innerWidth<900)$('#card').scrollIntoView({behavior:'smooth',block:'start'});return}
 const c=ev.target.closest('.chip');if(c){filt=c.dataset.t||null;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render();return}
 const l=ev.target.closest('[data-l]');if(l){document.body.className=l.dataset.l;document.querySelectorAll('[data-l]').forEach(x=>x.setAttribute('aria-pressed',x===l));try{localStorage.setItem('whl',l.dataset.l)}catch(_){}return}
 if(ev.target.id==='prev')step(-1);if(ev.target.id==='next')step(1);
 if(ev.target.id==='rev'){const a=$('#think .ans');a.hidden=!a.hidden;ev.target.setAttribute('aria-expanded',!a.hidden);ev.target.textContent=a.hidden?'看分析 Show reasoning':'收起 Hide'}
});
document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')step(1);if(ev.key==='ArrowLeft')step(-1)});
try{const s=localStorage.getItem('whl');if(s){document.querySelector(`[data-l="${s}"]`)?.click()}}catch(_){}
const h=location.hash.slice(1);if(BY[h])cur=h;
render();
}
</script>
</body>
</html>
