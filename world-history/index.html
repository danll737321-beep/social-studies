<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看懂世界史 World History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a patient teacher; clear, calm, logical — every fact earns its place by a "because".
   IDEA: a museum timeline wall paired with an atlas — walk the wall, follow the string to the next event.
   PICTURE: the era timeline with icon pins, plus a world map whose arcs show what each event caused.
   COLOUR and TYPE: lapis-blue band (map ink) on white, vermilion for cause arrows; one colour per era. Noto Sans TC + Archivo.
   LAYOUT: band with title + timeline; below, cause-effect card left, map + think-about-it right; stacks under 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d111c);--ink:light-dark(#141821,#e7eaf2);--mute:light-dark(#5b6272,#9aa3b5);
--line:light-dark(#e3e6ee,#232a3b);--soft:light-dark(#f4f6fb,#151b2b);--lap:light-dark(#1b3fb8,#1a2f80);
--lapink:#ffffff;--ver:light-dark(#d43d2a,#ff6b55);--sea:light-dark(#eef2fb,#111830);--landc:light-dark(#cfd7e8,#2a3552)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","Archivo",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ver);outline-offset:2px}
.band{padding:clamp(24px,3.5vw,48px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.top{background:var(--lap);color:var(--lapink)}
.hd{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
h1{font:900 clamp(32px,5vw,50px)/1.05 "Noto Sans TC",sans-serif;margin:0;text-wrap:balance}
h1 small{display:block;font:700 clamp(17px,2vw,22px)/1.3 Archivo,sans-serif;opacity:.85;margin-top:8px}
.sub{max-width:62ch;opacity:.9;margin:12px 0 0}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.seg button{border:0;background:none;color:#fff;padding:8px 14px;border-radius:999px;min-height:40px;font-size:15px}
.seg button[aria-pressed=true]{background:#fff;color:#1b3fb8;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{border:1.5px solid rgba(255,255,255,.55);background:none;color:#fff;border-radius:999px;padding:7px 14px;min-height:40px;font-size:15px}
.chip[aria-pressed=true]{background:#fff;color:#1b3fb8;border-color:#fff;font-weight:700}
.tl{margin-top:22px;background:var(--bg);color:var(--ink);border-radius:18px;overflow-x:auto;box-shadow:0 10px 30px rgba(0,0,30,.25)}
.tlin{display:grid;grid-template-columns:repeat(8,minmax(140px,1fr));min-width:1120px}
.era{border-right:1px solid var(--line);padding:14px 10px 12px;position:relative}
.era:last-child{border-right:0}
.era h3{margin:0;font:700 14px/1.3 "Noto Sans TC",sans-serif;color:var(--ec)}.era h3 .en{display:block;font-weight:600}
.era .yr{font:500 13px Archivo,sans-serif;color:var(--mute);white-space:nowrap}
.era .bar{height:6px;border-radius:3px;background:var(--ec);margin:10px 0 0}
.lane{position:relative;height:200px}
.pin{position:absolute;transform:translateX(-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:52px}
.pin .ic{width:38px;height:38px;border-radius:50%;background:var(--bg);border:2px solid var(--ec);color:var(--ec);display:grid;place-items:center;transition:transform .2s}
.pin svg{width:20px;height:20px}
.pin .py{font:700 12px Archivo,sans-serif;white-space:nowrap;color:var(--mute)}
.pin.on .ic{background:var(--ec);color:#fff;transform:scale(1.18)}
.pin.on .py{color:var(--ink)}
.pin.dim{opacity:.18}
main .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px}
@media(max-width:900px){main .grid{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2.5vw,28px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--mute);font-size:14px}
.tag{color:#fff;background:var(--ec);border-radius:6px;padding:2px 10px;font-weight:700}
.bigyr{font:800 clamp(34px,5vw,48px)/1 Archivo,sans-serif;color:var(--ec);margin:14px 0 4px}
h2{margin:0;font:900 clamp(26px,3.2vw,34px)/1.15 "Noto Sans TC",sans-serif;text-wrap:balance}
h2 .en{display:block;font:700 .62em/1.3 Archivo,sans-serif;color:var(--mute);margin-top:4px}
.flow{margin-top:22px;display:grid;gap:0}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start}
.step .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--ec)}
.step .n svg{width:22px;height:22px}
.step b{display:block;font-size:15px}
.step b i{font-style:normal;color:var(--mute);font-weight:500;font-family:Archivo,sans-serif;margin-left:6px}
.step p{margin:2px 0 0}
.arr{margin:4px 0 4px 21px;width:2px;height:22px;background:var(--ver);position:relative}
.arr::after{content:"";position:absolute;bottom:-2px;left:-5px;border:6px solid transparent;border-top:8px solid var(--ver);border-bottom:0}
.because{font-size:13px;color:var(--ver);font-weight:700;margin:-20px 0 0 36px;height:20px}
.en{font-family:Archivo,"Noto Sans TC",sans-serif}.zh+.en{margin-left:.35em}h2 .en,.era h3 .en,p .en,li .en,.box .en,.q .en,.mapcap .en{margin-left:0!important}.mapcap .en{display:block}
p .en,li .en,.box .en{display:block;color:var(--mute);font-size:15px;line-height:1.5}
body.lz .en{display:none!important}body.le .zh{display:none!important}
body.le p .en,body.le li .en,body.le .box .en{color:var(--ink);font-size:16px}
body.le h2 .en{font-size:1em;color:var(--ink)}
.box{margin-top:20px;border-radius:14px;padding:16px 18px;background:var(--soft)}
.box h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center}
.box h4 svg{width:20px;height:20px;color:var(--ec)}
.box p{margin:0}
.links{margin-top:20px;display:grid;gap:10px}
.links .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.links .lb{font-size:14px;color:var(--mute);width:128px;flex:none}
.go{border:1.5px solid var(--ec);color:var(--ink);background:none;border-radius:999px;padding:6px 12px;min-height:40px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.go:hover{background:var(--soft)}
.go em{font-style:normal;font-family:Archivo;font-weight:700;color:var(--ec)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.nav button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 16px;min-height:44px}
.side{display:grid;gap:22px;align-content:start}
.mapbox{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto}
.mapcap{padding:10px 14px;font-size:14px;color:var(--mute);border-top:1px solid var(--line);background:var(--bg)}
.mk{cursor:pointer}
.pulse{animation:pl 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.35}.pin .ic{transition:none}}
.think{border-radius:18px;padding:20px;background:var(--ec);color:#fff}
.think h4{margin:0 0 6px;font-size:15px;opacity:.9}
.think .q{font-weight:700;font-size:18px;line-height:1.45}
.think .q .en{display:block;color:rgba(255,255,255,.85);font-size:15px;font-weight:500}
.think button{margin-top:12px;background:#fff;color:#141821;border:0;border-radius:10px;padding:9px 16px;min-height:44px;font-weight:700}
.think .ans{margin-top:12px;background:rgba(0,0,0,.18);border-radius:12px;padding:12px 14px}
.think .ans p{margin:0}.think .ans .en{color:rgba(255,255,255,.85)!important}
.p2p{border:2px dashed var(--ec);border-radius:18px;padding:18px 20px}
.p2p h4{margin:0;font-size:16px}
.p2p .lead{margin:6px 0 12px}
.tmpl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:6px 0 14px}
.tmpl div{position:relative;border:1.5px solid var(--mute);border-radius:10px;min-height:62px;padding:6px;font-size:12px;color:var(--mute);text-align:center}
.tmpl div:not(:last-child)::after{content:"→";position:absolute;right:-16px;top:18px;color:var(--ver);font-weight:900}
.p2p ol{margin:0;padding-left:20px;font-size:15px}
.p2p li{margin:3px 0}
footer{color:var(--mute);font-size:13px}
@media(max-width:600px){.links .lb{width:100%}.tmpl{gap:14px}.tmpl div{font-size:11px;min-height:54px}}
</style>
</head>

const ERAS=[
{c:'#9a6b2f',n:['古代根基','Foundations'],s:-600,e:1750,std:'10.1',
 q:['為什麼兩千多年前雅典人的投票，會影響 1776 年的美國？','Why would Athenian voting 2,000+ years ago shape America in 1776?'],
 a:['思想不會因為國家滅亡就消失。它們被寫進書、法律和宗教裡保存下來。當 18 世紀的人想反抗國王，需要「為什麼人民可以自己做主」的理由，就回頭去找這些舊思想當證據。','Ideas outlive the states that made them. Stored in books, laws and religion, they waited. When 18th-century colonists needed a reason why people could rule themselves, they reached back to these old ideas as proof.']},
{c:'#d43d2a',n:['民主革命','Revolutions'],s:1680,e:1830,std:'10.2',
 q:['美國革命建立了穩定的共和國，法國革命卻陷入恐怖統治。差別在哪？','The American Revolution produced a stable republic; the French one fell into the Terror. What made the difference?'],
 a:['美國殖民地本來就有議會、地方自治，只是「換掉國王」；而且有大西洋保護。法國要同時推翻國王、教會、貴族整套制度，又遇到麵包短缺和外國軍隊入侵。壓力越大，越容易走向極端。','The colonies already had assemblies and local self-rule, so they mostly removed a king, and an ocean protected them. France tore down king, Church and nobility at once while facing bread shortages and foreign invasion. More pressure pushed it to extremes.']},
{c:'#55606e',n:['工業革命','Industrial Revolution'],s:1760,e:1900,std:'10.3',
 q:['工業革命為什麼先發生在英國，而不是人口更多的中國？','Why did industrialization start in Britain, not in more populous China?'],
 a:['英國工資高、煤炭便宜又靠近地表，所以「用機器取代人力」划算；加上殖民地提供棉花和市場、專利保護發明、銀行願意投資。中國勞力便宜，花大錢買機器反而不划算。關鍵是成本結構，不是聰明與否。','British wages were high and coal was cheap and near the surface, so replacing labor with machines paid off. Colonies supplied cotton and markets, patents protected inventors and banks lent money. In China labor was cheap, so costly machines made less sense. It was about costs, not cleverness.']},
{c:'#c26a00',n:['帝國主義','Imperialism'],s:1830,e:1914,std:'10.4',
 q:['同樣面對西方船堅炮利，為什麼日本避開了被瓜分，中國卻沒有？','Facing the same Western gunboats, why did Japan avoid being carved up while China did not?'],
 a:['日本親眼看到中國在鴉片戰爭的下場，危機感強；國家較小、中央容易統一意見，明治政府快速學習西方的軍隊、工廠與憲法。中國幅員大、舊官僚體系龐大，又同時面對太平天國等內亂，改革阻力更多。','Japan watched China lose the Opium War and felt the danger early. As a smaller country it could unify quickly, and the Meiji government copied Western armies, factories and constitutions. China was vast, its bureaucracy entrenched, and it faced huge rebellions at the same time, so reform met more resistance.']},
{c:'#7a2f8f',n:['第一次世界大戰','World War I'],s:1905,e:1925,std:'10.5–10.6',
 q:['一次暗殺，為什麼能引爆一場世界大戰？','How could one assassination set off a world war?'],
 a:['暗殺只是火花，真正的炸藥早就堆好了：同盟條約把國家綁在一起、各國軍隊有「先動員才不會輸」的時間表、民族主義讓人民支持開戰、殖民競爭累積了敵意。火花點到炸藥，一連串反應就停不下來。','The assassination was only a spark. The explosives were already stacked: alliances tied nations together, armies had mobilize-first timetables, nationalism made publics eager, and colonial rivalry built hostility. Once lit, the chain reaction could not be stopped.']},
{c:'#263043',n:['極權與二戰','Totalitarianism & WWII'],s:1925,e:1946,std:'10.7–10.8',
 q:['為什麼有些國家的人民，會支持獨裁的領袖上台？','Why did people in some countries back dictators coming to power?'],
 a:['經濟大蕭條讓人失業挨餓，凡爾賽條約讓德國人覺得被羞辱，民主政府又顯得軟弱無力。當人們極度不安時，「我能恢復秩序和尊嚴」的承諾特別吸引人，即使代價是失去自由。','The Depression brought hunger and joblessness, Versailles left Germans feeling humiliated, and democratic governments looked weak. When people feel desperate, a promise to restore order and pride is powerful, even at the cost of freedom.']},
{c:'#1a7f8e',n:['冷戰與去殖民','Cold War & Decolonization'],s:1945,e:1991,std:'10.9',
 q:['美國和蘇聯從來沒有直接開戰，為什麼還叫「戰爭」？','The U.S. and USSR never fought each other directly. Why call it a "war"?'],
 a:['因為雙方都有核武，直接開戰等於同歸於盡（嚇阻）。所以競爭轉到別處：在韓國、越南等地支持不同陣營打代理人戰爭，加上軍備競賽、太空競賽和宣傳戰。不打仗，但一直在對抗。','Both sides had nuclear weapons, so direct war meant mutual destruction (deterrence). Rivalry moved elsewhere: proxy wars in Korea and Vietnam, an arms race, a space race and propaganda. No direct battle, but constant conflict.']},
{c:'#2c8a4b',n:['當代與全球化','Today & Globalization'],s:1975,e:2025,std:'10.10–10.11',
 q:['全球化讓世界整體變得更富有，為什麼還有很多人反對它？','Globalization made the world richer overall. Why do many people oppose it?'],
 a:['「整體變好」不等於「每個人都變好」。便宜的商品和新工作出現了，但一些工廠移到工資更低的國家，原本的工人失業；文化和環境也受到衝擊。分析時要問：誰得到好處？誰付出代價？','"Better overall" is not "better for everyone." Cheap goods and new jobs appeared, but some factories moved to lower-wage countries and workers lost jobs; cultures and environments felt pressure too. Always ask: who gains, and who pays?']}
];

{id:'athens',era:0,y:'508 BCE',yr:-508,ic:'temple',t:['雅典民主','Athenian Democracy'],pl:['雅典','Athens'],loc:[23.7,38],th:['pol','idea'],to:['enlight','amrev'],

{id:'rome',era:0,y:'509 BCE',yr:-509,ic:'scroll',t:['羅馬共和與法律','Roman Republic & Law'],pl:['羅馬','Rome'],loc:[12.5,41.9],th:['pol'],to:['amrev'],

{id:'judeo',era:0,y:'c. 30 CE',yr:30,ic:'cross',t:['猶太教與基督教的道德觀','Judeo-Christian Ideas'],pl:['耶路撒冷','Jerusalem'],loc:[35.2,31.8],th:['idea'],to:['enlight'],
c:['猶太教強調一神與道德律法；基督教從中發展，向羅馬帝國各地傳播。','Judaism stressed one God and moral law; Christianity grew out of it and spread across the Roman Empire.'],
a:['兩者都教導：每個人在神面前都有價值，連國王也要守道德律。','Both taught that every person has worth before God and that even kings answer to moral law.'],
r:['基督教後來成為羅馬國教，影響歐洲上千年的價值觀。','Christianity became Rome\'s official religion and shaped European values for over a thousand years.'],

{id:'magna',era:0,y:'1215',yr:1215,ic:'crown',t:['大憲章','Magna Carta'],pl:['英格蘭','England'],loc:[-0.6,51.4],th:['pol'],to:['enlight','amrev'],

a:['貴族逼國王簽下《大憲章》：國王也受法律限制，不能任意抓人或徵稅。','The barons forced him to sign Magna Carta: the king is under the law and cannot jail people or tax at will.'],

{id:'enlight',era:1,y:'1690–1760',yr:1720,ic:'bulb',t:['啟蒙運動','The Enlightenment'],pl:['巴黎','Paris'],loc:[2.35,48.85],th:['idea'],to:['amrev','frrev','latam'],
c:['科學革命證明理性能解釋自然；人們開始問：理性能不能也解釋政治？','The Scientific Revolution showed reason could explain nature. People asked: could reason explain politics too?'],
a:['洛克提出天賦人權（生命、自由、財產）；孟德斯鳩提出三權分立；盧梭提出人民主權。','Locke argued for natural rights (life, liberty, property); Montesquieu for separation of powers; Rousseau for popular sovereignty.'],
r:['「國王的權力來自神」被質疑，政府的權力應來自人民同意。','The divine right of kings was questioned; government should rest on the consent of the governed.'],
l:['這些想法直接寫進了美國《獨立宣言》和法國《人權宣言》。','These ideas went straight into the Declaration of Independence and the Declaration of the Rights of Man.'],
d:['像不再接受「因為我說了算」，而是要求「請說出道理」。','Like refusing "because I said so" and asking "give me a reason."']
,p:['畫一顆燈泡，光線照向三個框：立法、行政、司法。','Draw a light bulb shining on three boxes: legislative, executive, judicial.']},
{id:'amrev',era:1,y:'1776',yr:1776,ic:'flag',t:['美國獨立革命','American Revolution'],pl:['費城','Philadelphia'],loc:[-75.16,39.95],th:['pol','war'],to:['frrev','latam'],
c:['英國打完七年戰爭欠債，向殖民地加稅，但殖民地在國會沒有代表。','After the Seven Years\' War left Britain in debt, it taxed the colonies, which had no seats in Parliament.'],
a:['1776 年發表《獨立宣言》，以啟蒙思想說明反抗的理由，並打贏獨立戰爭（法國幫忙）。','The 1776 Declaration of Independence used Enlightenment ideas to justify revolt, and the colonies won the war with French help.'],
r:['建立憲法共和國：三權分立、權利法案。','A constitutional republic with separated powers and a Bill of Rights.'],
l:['證明「推翻國王、建立共和」做得到，鼓舞了法國與拉丁美洲。','It proved a king could be replaced by a republic, inspiring France and Latin America.'],
d:['像社團幹部被要求繳錢，卻沒有投票權，最後乾脆自己成立新社團。','Like club members charged dues with no vote, who finally start their own club.'],
p:['畫箭頭鏈：欠債 → 加稅 → 抗議 → 宣言 → 戰爭 → 共和。','Draw a chain: debt → taxes → protest → declaration → war → republic.']},
{id:'frrev',era:1,y:'1789',yr:1789,ic:'star',t:['法國大革命','French Revolution'],pl:['巴黎','Paris'],loc:[2.35,48.85],th:['pol','war','idea'],to:['napoleon'],
c:['國家破產（部分因資助美國革命）、麵包價格暴漲、第三等級繳稅卻沒有權力。','France was bankrupt (partly from funding the American war), bread prices soared, and the Third Estate paid taxes without power.'],
a:['1789 年攻占巴士底監獄、發表《人權宣言》，之後處決國王，進入恐怖統治。','Revolutionaries stormed the Bastille, issued the Declaration of the Rights of Man, executed the king, then entered the Terror.'],
r:['君主專制與貴族特權被推翻，但社會陷入混亂和暴力。','Absolute monarchy and noble privilege fell, but the country descended into chaos and violence.'],
l:['「自由、平等、博愛」與民族主義傳遍歐洲；混亂也讓強人有機會掌權。','"Liberty, equality, fraternity" and nationalism spread across Europe; the chaos also opened the door to a strongman.'],
d:['像全班受不了不公平的規則推翻了舊幹部，但新規則還沒訂好，就開始吵架。','Like a class overthrowing unfair officers before agreeing on new rules, then fighting among themselves.'],

{id:'napoleon',era:1,y:'1799–1815',yr:1804,ic:'horse',t:['拿破崙','Napoleon'],pl:['法國','France'],loc:[1.5,47],th:['pol','war'],to:['latam'],
c:['革命後政府混亂，人民想要秩序。','The post-revolution government was chaotic and people wanted order.'],

{id:'latam',era:1,y:'1810–1825',yr:1818,ic:'eagle',t:['拉丁美洲獨立','Latin American Independence'],pl:['卡拉卡斯','Caracas'],loc:[-66.9,10.5],th:['pol','war'],to:[],
c:['西班牙被拿破崙占領而無力管殖民地；在地出生的克里奧爾人受啟蒙與美國影響，不滿被歧視。','With Spain occupied by Napoleon, it could not control its colonies; locally born Creoles, inspired by the Enlightenment and the U.S., resented discrimination.'],

{id:'steam',era:2,y:'1769',yr:1769,ic:'gear',t:['蒸汽機與工廠','Steam Engine & Factories'],pl:['曼徹斯特','Manchester'],loc:[-2.24,53.48],th:['tech'],to:['urban','scramble','opium'],

{id:'urban',era:2,y:'1830s',yr:1835,ic:'factory',t:['都市化與勞工問題','Cities & Labor'],pl:['英國工業城市','British mill towns'],loc:[-1.5,53.8],th:['tech','pol'],to:['marx'],

{id:'opium',era:3,y:'1839–1842',yr:1840,ic:'ship',t:['鴉片戰爭','Opium War'],pl:['廣州','Guangzhou'],loc:[113.3,23.1],th:['war','glob'],to:['meiji','chinarev'],

{id:'meiji',era:3,y:'1868',yr:1868,ic:'sun',t:['明治維新','Meiji Restoration'],pl:['東京','Tokyo'],loc:[139.7,35.7],th:['pol','tech'],to:['ww2'],
c:['1853 年美國艦隊逼日本開港；日本看到中國戰敗，擔心被殖民。','In 1853 U.S. warships forced Japan open; seeing China\'s defeat, Japan feared colonization.'],
a:['推翻幕府、天皇復權，全面學習西方：工業、鐵路、徵兵、憲法、學校。','The shogunate fell, the emperor was restored, and Japan copied the West in industry, railways, conscription, a constitution and schools.'],
r:['約 30 年內成為工業強國，打敗中國（1895）和俄國（1905）。','Within about 30 years it industrialized and defeated China (1895) and Russia (1905).'],
l:['日本自己也走向帝國主義，侵略韓國、中國，最終捲入二戰。','Japan became an imperial power itself, invading Korea and China and eventually entering WWII.'],
d:['像看到隔壁班考試被當，馬上找最強的同學學方法，結果自己變成新的強者。','Like seeing the class next door fail, copying the top students\' methods, and becoming the new top dog.'],
p:['畫一個「輸入 → 轉換 → 輸出」框：西方技術 → 日本改造 → 強國。','Draw an input → process → output box: Western tech → Japanese adaptation → great power.']},
{id:'scramble',era:3,y:'1884',yr:1884,ic:'map',t:['瓜分非洲','Scramble for Africa'],pl:['柏林會議','Berlin'],loc:[13.4,52.5],th:['glob','pol'],to:['ww1'],
c:['工業國需要橡膠、金屬等原料和市場；新武器與奎寧讓深入非洲變得可能。','Industrial powers needed rubber, metals and markets; new weapons and quinine made deep inroads into Africa possible.'],
a:['歐洲列強在柏林會議上，用尺在地圖上畫線瓜分非洲，沒有任何非洲人參與。','At the Berlin Conference European powers divided Africa with rulers on a map, with no Africans present.'],
r:['到 1914 年，非洲只剩衣索比亞和賴比瑞亞未被殖民。','By 1914 only Ethiopia and Liberia remained uncolonized.'],
l:['人為邊界把不同民族硬湊在一起，至今仍是衝突根源；列強競爭也加劇了一戰前的敵意。','Artificial borders forced rival groups together, still a source of conflict; colonial rivalry also sharpened pre-WWI tensions.'],
d:['像別人在你家地圖上畫線分房間，卻從沒問過住在裡面的人。','Like strangers drawing lines on your house plan to divide the rooms without asking who lives there.'],
p:['在非洲輪廓上畫幾條直線邊界，並寫下「誰畫的？誰住在這？」','Draw straight borders across Africa\'s outline and write "Who drew it? Who lives here?"']},
{id:'ww1',era:4,y:'1914',yr:1914,ic:'swords',t:['第一次世界大戰爆發','World War I Begins'],pl:['塞拉耶佛','Sarajevo'],loc:[18.4,43.86],th:['war'],to:['versailles','russrev'],
c:['四大成因 M-A-I-N：軍國主義、同盟、帝國主義、民族主義。','Four causes, M-A-I-N: Militarism, Alliances, Imperialism, Nationalism.'],
a:['奧匈帝國王儲在塞拉耶佛被刺殺，同盟連鎖反應，各國相繼參戰。','Austria-Hungary\'s heir was assassinated in Sarajevo; alliances pulled nation after nation into war.'],
r:['機槍、毒氣、壕溝戰造成約 1,600 萬人死亡；四大帝國崩潰。','Machine guns, gas and trench warfare killed about 16 million; four empires collapsed.'],
l:['戰後的不滿和經濟問題，為第二次世界大戰埋下伏筆。','Postwar resentment and economic trouble set the stage for World War II.'],
d:['像一群人互相承諾「誰打你我就幫你」，結果一個人推了另一個人，全部人打成一團。','Like friends all promising "if anyone hits you, I\'ll jump in," so one shove starts a brawl involving everyone.'],
p:['畫一堆柴火標上 M、A、I、N，再畫一根火柴寫「暗殺」。','Draw a woodpile labeled M, A, I, N, and a match labeled "assassination."']},
{id:'russrev',era:4,y:'1917',yr:1917,ic:'star',t:['俄國革命','Russian Revolution'],pl:['彼得格勒','Petrograd'],loc:[30.3,59.9],th:['pol','idea'],to:['coldwar'],
c:['一戰慘敗、糧食短缺，沙皇政府腐敗無能。','Crushing WWI losses, food shortages and a corrupt, inept tsarist regime.'],
a:['沙皇退位；列寧的布爾什維克以「和平、土地、麵包」奪權，建立共產政權。','The tsar abdicated; Lenin\'s Bolsheviks seized power promising "peace, land, bread" and built a communist state.'],
r:['1922 年成立蘇聯；史達林後來以恐怖手段集體化與工業化。','The USSR formed in 1922; Stalin later forced collectivization and industrialization through terror.'],
l:['世界第一個共產國家，和資本主義國家的對立最終形成冷戰。','The first communist state; its rivalry with capitalist nations became the Cold War.'],
d:['像餐廳一直出問題又漲價，客人最後支持一個承諾「免費供餐」的新老闆。','Like customers at a failing, pricey restaurant backing a new owner who promises free meals.'],
p:['畫天秤：左邊放「戰爭、飢餓、腐敗」，右邊放「和平、土地、麵包」的承諾。','Draw a scale: "war, hunger, corruption" on one side, "peace, land, bread" on the other.']},
{id:'versailles',era:4,y:'1919',yr:1919,ic:'doc',t:['凡爾賽條約','Treaty of Versailles'],pl:['凡爾賽','Versailles'],loc:[2.1,48.8],th:['pol','war'],to:['hitler'],
c:['戰勝國（尤其法國）想讓德國付出代價，防止它再強大。','The victors, especially France, wanted Germany to pay and never threaten them again.'],
a:['條約要德國承擔戰爭全部責任、割地、巨額賠款、限制軍隊。','The treaty blamed Germany for the war, took land, demanded huge reparations and limited its army.'],
r:['德國人感到屈辱又貧困；國際聯盟成立但缺乏力量。','Germans felt humiliated and impoverished; the League of Nations formed but lacked teeth.'],
l:['這份「懲罰型和約」成為希特勒崛起的養分。','This punitive peace fed Hitler\'s rise.'],
d:['像打架後只罰一方、罰得極重，他心裡不服，之後更容易報復。','Like punishing only one side of a fight, harshly, so they nurse a grudge and seek revenge.'],
p:['畫一個背著沉重包袱的人，包袱上寫：割地、賠款、全責。','Draw a person carrying a heavy pack labeled: land loss, reparations, full blame.']},
{id:'depression',era:5,y:'1929',yr:1929,ic:'chart',t:['經濟大蕭條','Great Depression'],pl:['紐約','New York'],loc:[-74,40.7],th:['tech','glob'],to:['hitler'],
c:['1920 年代借錢炒股、生產過剩，美國資金又撐著歐洲經濟。','In the 1920s people bought stocks on credit, factories overproduced, and American loans propped up Europe.'],
a:['1929 年華爾街股市崩盤，銀行倒閉，美國收回對外貸款。','Wall Street crashed in 1929, banks failed, and the U.S. called in foreign loans.'],
r:['全球失業率飆升，德國失業率約達三成。','Unemployment soared worldwide; roughly 30% in Germany.'],
l:['絕望的人民轉向極端政黨；也促使政府開始介入經濟（如美國新政）。','Desperate voters turned to extremists; governments also began managing economies (e.g., the New Deal).'],
d:['像大家都用信用卡借錢買東西，有一天銀行同時要大家還錢。','Like everyone buying on credit until the bank demands everyone pay back at once.'],
p:['畫骨牌：股市崩盤 → 銀行倒閉 → 工廠關門 → 失業 → 支持極端政黨。','Draw dominoes: crash → bank failures → closed factories → joblessness → extremist votes.']},
{id:'hitler',era:5,y:'1933',yr:1933,ic:'eagle',t:['極權政權崛起','Rise of Totalitarian States'],pl:['柏林','Berlin'],loc:[13.4,52.5],th:['pol','idea'],to:['ww2'],
c:['凡爾賽條約的屈辱 + 大蕭條的失業 + 怕共產主義 + 民主政府無力。','Versailles humiliation + Depression joblessness + fear of communism + a weak democracy.'],
a:['希特勒透過選舉和政治操作上台，隨即廢除民主、迫害猶太人、擴軍；義大利、蘇聯也是極權統治。','Hitler rose through elections and backroom deals, then ended democracy, persecuted Jews and rearmed; Italy and the USSR were also totalitarian.'],
r:['國家控制媒體、教育、經濟，個人自由消失。','The state controlled media, schools and the economy; personal freedom vanished.'],
l:['擴張野心直接導致二戰，也讓世界學到「民主需要保護」。','Expansionist goals led straight to WWII and taught the world that democracy must be defended.'],
d:['像有人承諾「選我就讓大家重新被尊重」，選上後卻把所有規則都改成只對他有利。','Like someone promising to restore everyone\'s pride, then rewriting every rule in their own favor once elected.'],
p:['畫一個漏斗：上面倒入四個成因，下面流出「獨裁」。','Draw a funnel: four causes pour in at the top, "dictatorship" flows out the bottom.']},
{id:'ww2',era:5,y:'1939',yr:1939,ic:'swords',t:['第二次世界大戰','World War II'],pl:['華沙','Warsaw'],loc:[21,52.2],th:['war','glob'],to:['holocaust','atomic'],
c:['德、義、日擴張；英法採取「綏靖政策」一再退讓。','Germany, Italy and Japan expanded while Britain and France kept appeasing them.'],
a:['1939 年德國入侵波蘭，英法宣戰；1941 年日本偷襲珍珠港，美國參戰。','Germany invaded Poland in 1939 and Britain and France declared war; Japan hit Pearl Harbor in 1941, bringing in the U.S.'],
r:['約 7,000 萬人死亡，是人類史上最慘烈的戰爭；同盟國 1945 年勝利。','About 70 million died, history\'s deadliest war; the Allies won in 1945.'],
l:['歐洲衰落，美蘇成為兩大超強，世界進入冷戰。','Europe declined, the U.S. and USSR became superpowers, and the Cold War began.'],
d:['像霸凌者每次要更多，大家都說「這次給他就好」，結果他越來越大膽。','Like giving in to a bully "just this once" again and again, so he only grows bolder.'],
p:['畫一條樓梯，每一階寫一次退讓，最上面寫「戰爭」。','Draw a staircase: each step is one concession, with "war" at the top.']},
{id:'holocaust',era:5,y:'1941–1945',yr:1942,ic:'candle',t:['猶太人大屠殺','The Holocaust'],pl:['奧斯威辛','Auschwitz'],loc:[19.2,50],th:['pol','idea'],to:['israel'],
c:['納粹把經濟困境歸咎於猶太人，用宣傳散播種族仇恨。','The Nazis blamed Jews for Germany\'s troubles and spread racial hatred through propaganda.'],
a:['從剝奪公民權、集中隔離，到有系統地屠殺約 600 萬猶太人及其他群體。','Step by step: stripping rights, ghettos, then the systematic murder of about six million Jews and millions of others.'],
r:['戰後紐倫堡大審，首次以「危害人類罪」審判領導人。','The Nuremberg Trials prosecuted leaders for "crimes against humanity" for the first time.'],
l:['催生了《世界人權宣言》與防止種族滅絕的國際公約。','It led to the Universal Declaration of Human Rights and the Genocide Convention.'],
d:['仇恨很少一開始就是暴力，而是從貼標籤、排擠、沉默一步步升級。','Hatred rarely starts with violence; it escalates from labels to exclusion to silence.'],
p:['畫一道往上的階梯：偏見 → 歧視 → 隔離 → 暴力，並在每一階旁寫「這時候可以怎麼阻止？」','Draw rising steps: prejudice → discrimination → segregation → violence, and beside each write "How could this be stopped here?"']},
{id:'atomic',era:5,y:'1945',yr:1945,ic:'atom',t:['原子彈與聯合國','Atomic Bomb & the UN'],pl:['廣島','Hiroshima'],loc:[132.5,34.4],th:['war','tech','glob'],to:['coldwar'],
c:['美國擔心進攻日本本土會傷亡慘重；科學家已研發出核武。','The U.S. feared huge casualties invading Japan; scientists had built nuclear weapons.'],
a:['美國在廣島、長崎投下原子彈，日本投降；同年成立聯合國。','The U.S. dropped atomic bombs on Hiroshima and Nagasaki and Japan surrendered; the UN was founded that year.'],
r:['二戰結束，人類進入核武時代。','WWII ended and the nuclear age began.'],
l:['核武讓大國不敢直接開戰，形成冷戰的「恐怖平衡」。','Nuclear weapons kept great powers from fighting directly, creating the Cold War\'s balance of terror.'],
d:['像兩個人都拿著一按就同歸於盡的按鈕，誰也不敢先動手。','Like two people each holding a button that destroys both; neither dares move first.'],
p:['畫兩個人各握一顆按鈕，中間寫「嚇阻」。','Draw two figures each holding a button, with "deterrence" between them.']},
{id:'coldwar',era:6,y:'1947',yr:1947,ic:'globe',t:['冷戰開始','The Cold War Begins'],pl:['華盛頓','Washington'],loc:[-77,38.9],th:['war','pol','glob'],to:['cuba','wall'],
c:['二戰後美國（資本主義、民主）與蘇聯（共產主義、一黨）都想塑造戰後世界。','After WWII the capitalist, democratic U.S. and the communist, one-party USSR each wanted to shape the postwar world.'],
a:['美國提出杜魯門主義「圍堵共產主義」和馬歇爾計畫援助歐洲；歐洲分裂成東西兩邊。','The U.S. announced containment (Truman Doctrine) and the Marshall Plan; Europe split into East and West.'],
r:['北約與華沙公約對峙；韓戰、越戰成為代理人戰爭。','NATO faced the Warsaw Pact; Korea and Vietnam became proxy wars.'],
l:['軍備競賽、太空競賽持續 40 多年，影響全球每個地區。','The arms and space races lasted over 40 years and touched every region.'],
d:['像兩大社團不直接吵架，而是各自拉攏其他同學站邊。','Like two rival clubs that never fight directly but recruit everyone else to pick a side.'],
p:['畫一張世界地圖，用兩種顏色標出兩個陣營，再圈出代理人戰爭的地點。','Color a world map in two camps and circle the proxy-war locations.']},
{id:'decolon',era:6,y:'1947',yr:1947,ic:'chain',t:['印度獨立與去殖民化','India & Decolonization'],pl:['新德里','New Delhi'],loc:[77.2,28.6],th:['pol','glob'],to:['apartheid'],
c:['二戰讓歐洲殖民國元氣大傷；殖民地人民的民族主義高漲。','WWII exhausted the colonial powers while nationalism surged in the colonies.'],
a:['甘地以非暴力抗爭帶領印度在 1947 年獨立（同時印巴分治）；之後亞洲、非洲數十國獨立。','Gandhi\'s nonviolent movement won Indian independence in 1947 (with partition); dozens of Asian and African nations followed.'],
r:['聯合國會員國大增，殖民帝國瓦解。','UN membership ballooned as empires dissolved.'],
l:['新國家面臨人為邊界、經濟依賴與冷戰拉攏的挑戰。','New nations faced artificial borders, economic dependence and Cold War pressure.'],
d:['像室友搬出去自己住，終於自由，但房租、家具都得自己想辦法。','Like moving out from roommates: finally free, but now rent and furniture are your problem.'],
p:['畫一條斷掉的鎖鏈，兩端分別寫「殖民母國變弱」與「民族主義變強」。','Draw a broken chain; label the ends "empire weakens" and "nationalism grows."']},
{id:'chinarev',era:6,y:'1949',yr:1949,ic:'star',t:['中華人民共和國成立','People\'s Republic of China'],pl:['北京','Beijing'],loc:[116.4,39.9],th:['pol','war'],to:['china_open'],
c:['清朝滅亡後中國長期分裂、日本侵略；國民黨與共產黨爭奪政權。','After the Qing fell China stayed divided and was invaded by Japan; the Nationalists and Communists fought for control.'],
a:['毛澤東領導共產黨獲得農民支持，在內戰中獲勝；國民政府撤退到台灣。','Mao\'s Communists won peasant support and the civil war; the Nationalist government retreated to Taiwan.'],
r:['中國成為共產國家；大躍進、文化大革命造成嚴重饑荒與動亂。','China became communist; the Great Leap Forward and Cultural Revolution caused famine and upheaval.'],
l:['兩岸分治的格局延續至今；毛之後的改革開放改變了中國經濟。','The cross-Strait divide continues today; post-Mao reforms transformed China\'s economy.'],
d:['分析題：為什麼農民的支持是關鍵？因為中國當時九成人口是農民。','Analysis: why did peasant support matter? About 90% of China was rural.'],
p:['畫一個圓餅圖：農民占九成，並寫下哪一方得到了他們的支持。','Draw a pie chart (90% peasants) and note which side won them over.']},
{id:'israel',era:6,y:'1948',yr:1948,ic:'dove',t:['以色列建國與中東衝突','Israel & the Middle East'],pl:['耶路撒冷','Jerusalem'],loc:[35.2,31.8],th:['pol','war'],to:[],
c:['錫安主義運動希望建立猶太家園；大屠殺後需求更迫切；巴勒斯坦阿拉伯人也在同一塊土地上生活並爭取建國。','Zionists sought a Jewish homeland, made urgent by the Holocaust; Palestinian Arabs lived on the same land and sought their own state.'],
a:['1947 年聯合國提出分治方案；1948 年以色列宣布建國，隨即與阿拉伯鄰國爆發戰爭。','The UN proposed partition in 1947; Israel declared independence in 1948 and war with Arab neighbors followed at once.'],
r:['以色列存續；大量巴勒斯坦人成為難民。','Israel survived; hundreds of thousands of Palestinians became refugees.'],
l:['土地、安全與建國權的爭議延續至今，也牽動石油與大國外交。','Disputes over land, security and statehood continue, entangled with oil and great-power diplomacy.'],
d:['分析時練習：同一塊土地，兩群人都有歷史上的連結，各自的訴求是什麼？','Practice: two peoples have historic ties to one land. What does each side claim, and why?'],
p:['畫一個雙欄表：左邊寫一方的訴求與理由，右邊寫另一方的。','Make a two-column chart: one side\'s claims and reasons, then the other\'s.']},
{id:'cuba',era:6,y:'1962',yr:1962,ic:'rocket',t:['古巴飛彈危機','Cuban Missile Crisis'],pl:['哈瓦那','Havana'],loc:[-82.4,23.1],th:['war'],to:[],
c:['古巴革命後倒向蘇聯；美國在土耳其部署飛彈對準蘇聯。','After its revolution Cuba sided with the USSR; the U.S. had missiles in Turkey aimed at the Soviets.'],
a:['蘇聯在古巴秘密部署核彈；美國封鎖古巴，雙方對峙 13 天。','The USSR secretly placed nuclear missiles in Cuba; the U.S. blockaded the island for a 13-day standoff.'],
r:['蘇聯撤除古巴飛彈，美國承諾不入侵古巴並秘密撤走土耳其飛彈。','The Soviets removed the missiles; the U.S. pledged not to invade Cuba and quietly pulled missiles from Turkey.'],
l:['世界最接近核戰的一刻；之後美蘇設立熱線並簽署限武條約。','The closest the world came to nuclear war; afterward came a hotline and arms-control treaties.'],
d:['像兩個人吵架到要動手，最後各退一步，保住面子也避開災難。','Like two people on the edge of a fight who each step back, saving face and avoiding disaster.'],
p:['畫兩把指向對方的飛彈：一把在古巴、一把在土耳其，再畫出最後的「交換」。','Draw missiles aimed both ways (Cuba, Turkey), then sketch the final trade.']},
{id:'wall',era:6,y:'1989',yr:1989,ic:'wall',t:['柏林圍牆倒塌','Fall of the Berlin Wall'],pl:['柏林','Berlin'],loc:[13.4,52.5],th:['pol','glob'],to:['global'],
c:['蘇聯經濟停滯、軍備競賽拖垮財政；戈巴契夫推動開放與改革。','The Soviet economy stagnated and the arms race drained it; Gorbachev pushed openness and reform.'],
a:['1989 年東歐各國和平抗爭，柏林圍牆倒塌；1991 年蘇聯解體。','In 1989 peaceful protests swept Eastern Europe and the Berlin Wall fell; the USSR dissolved in 1991.'],
r:['冷戰結束，德國統一，東歐走向民主與市場經濟。','The Cold War ended, Germany reunified, and Eastern Europe moved toward democracy and markets.'],
l:['美國成為唯一超強，全球化加速。','The U.S. became the sole superpower and globalization accelerated.'],
d:['像一個長期入不敷出的家庭，硬撐門面撐不下去，最後整個重組。','Like a household spending beyond its means for years until it finally has to restructure.'],
p:['畫一座磚牆，每塊磚寫一個倒塌原因（經濟、改革、抗爭）。','Draw a brick wall; write one cause of collapse on each brick.']},
{id:'china_open',era:7,y:'1978',yr:1978,ic:'up',t:['中國改革開放','China\'s Economic Reforms'],pl:['深圳','Shenzhen'],loc:[114.1,22.5],th:['tech','glob'],to:['global'],

const BY=Object.fromEntries(EV.map(e=>[e.id,e]));
const FROM={};EV.forEach(e=>e.to.forEach(t=>(FROM[t]=FROM[t]||[]).push(e.id)));
let cur='athens',filt=null;

const $=s=>document.querySelector(s);
const xy=([lo,la])=>[(lo+180)/360*960,(90-la)/180*480];

$('#chips').innerHTML='<button class="chip" data-t="" aria-pressed="true">全部 All</button>'+Object.entries(TH).map(([k,v])=>`<button class="chip" data-t="${k}" aria-pressed="false">${v[0]} ${v[1]}</button>`).join('');

$('#tl').innerHTML=ERAS.map((er,i)=>{
 const evs=EV.filter(e=>e.era===i);
 const sorted=[...evs].sort((a,b)=>a.yr-b.yr);
 const pins=sorted.map((e,j)=>{
  let pct=20+60*(sorted.length===1?.5:j/(sorted.length-1));
  const top=16+(sorted.length>3?j%3:j%2)*60;
  return `<button class="pin" data-id="${e.id}" style="left:${pct}%;top:${top}px" aria-label="${e.y} ${e.t[0]} ${e.t[1]}"><span class="ic">${svg(e.ic)}</span><span class="py">${e.y.replace('c. ','').replace(' BCE','BC').split('–')[0].replace('1990s','1990s+')}</span></button>`}).join('');
 const yr=i===0?'600 BC–1750':`${er.s}–${i===7?'today':er.e}`;
 return `<div class="era" style="--ec:${er.c}"><h3>${b(er.n)}</h3><div class="yr">${yr} · ${er.std}</div><div class="bar"></div><div class="lane">${pins}</div></div>`}).join('');

function linkBtns(ids){return ids.length?ids.map(id=>{const e=BY[id];return `<button class="go" data-id="${id}" style="--ec:${ERAS[e.era].c}"><em>${e.y}</em>${b(e.t)}</button>`}).join(''):'<span style="color:var(--mute);font-size:14px">—</span>'}

function render(){
 const e=BY[cur],er=ERAS[e.era];
 document.documentElement.style.setProperty('--ec',er.c);
 const steps=[['doc','背景與問題','Background',e.c,'因為 because'],['flag','關鍵事件','Event',e.a,'所以 so'],['up','直接結果','Result',e.r,'長期來看 over time'],['globe','長期影響','Long-term impact',e.l,'']];
 $('#card').innerHTML=`<div class="meta"><span class="tag">${b(er.n)}</span><span>${b(e.pl)}</span><span>CA HSS ${er.std}</span></div>
 <div class="bigyr">${e.y}</div><h2>${e.t[0]}<span class="en">${e.t[1]}</span></h2>
 <div class="flow">${steps.map((s,i)=>`<div class="step"><div class="n">${svg(s[0])}</div><div><b>${s[1]}<i>${s[2]}</i></b><p>${b(s[3])}</p></div></div>${i<3?`<div class="arr"></div><div class="because">${s[4]}</div>`:''}`).join('')}</div>
 <div class="box"><h4>${svg('bulb')}<span>生活類比 · Everyday link</span></h4><p>${b(e.d)}</p></div>
 <div class="links"><div class="row"><span class="lb">← 前因 Came from</span>${linkBtns(FROM[cur]||[])}</div><div class="row"><span class="lb">→ 引發 Led to</span>${linkBtns(e.to)}</div></div>
 <div class="nav"><button id="prev">← 上一個 Prev</button><button id="next">下一個 Next →</button></div>`;
 $('#think').innerHTML=`<h4>想一想 · Think about it — ${b(er.n)}</h4><div class="q">${b(er.q)}</div><button id="rev" aria-expanded="false">看分析 Show reasoning</button><div class="ans" hidden><p>${b(er.a)}</p></div>`;
 $('#p2p').innerHTML=`<h4>Picture to Pencil · 畫出因果</h4><p class="lead">${b(e.p)}</p>
 <div class="tmpl"><div>背景<br>Cause</div><div>事件<br>Event</div><div>結果<br>Result</div><div>影響<br>Impact</div></div>
 <ol><li>${b(['每個箭頭都能說成「因為…所以…」嗎？','Can every arrow be read as "because… so…"?'])}</li><li>${b(['至少找出兩個原因，不只一個。','Find at least two causes, not one.'])}</li><li>${b(['用一句話向同學解釋你的圖。','Explain your drawing to a classmate in one sentence.'])}</li></ol>`;
 document.querySelectorAll('.pin').forEach(p=>{p.classList.toggle('on',p.dataset.id===cur);p.classList.toggle('dim',!!filt&&!BY[p.dataset.id].th.includes(filt))});
 drawMap();
 const n=e.to.length;
 $('#mapcap').innerHTML=b([`${e.pl[0]}。${n?`紅線：這件事影響了 ${n} 個後續事件。`:'這是一條因果鏈的終點（目前）。'}點地圖上的點可跳轉。`,`${e.pl[1]}. ${n?`Red arcs: this led to ${n} later event${n>1?'s':''}.`:'End of this chain (for now).'} Tap a dot to jump.`]);
}
function drawMap(){
 const e=BY[cur],[x0,y0]=xy(e.loc);
 $('#arcs').innerHTML=[...e.to.map(id=>[id,'var(--ver)']),...(FROM[cur]||[]).map(id=>[id,'var(--mute)'])].map(([id,col])=>{
  const [x1,y1]=xy(BY[id].loc);const mx=(x0+x1)/2,my=Math.min(y0,y1)-Math.max(30,Math.abs(x1-x0)*.25);
  return `<path d="M${x0},${y0} Q${mx},${my} ${x1},${y1}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="${col==='var(--ver)'?'0':'5 4'}"/>`}).join('');
 $('#mks').innerHTML=EV.map(v=>{const [x,y]=xy(v.loc),on=v.id===cur,c=ERAS[v.era].c,dim=filt&&!v.th.includes(filt);
  return `<g class="mk" data-id="${v.id}" opacity="${dim?.2:1}"><title>${v.y} ${v.t[0]} ${v.t[1]}</title>${on?`<circle cx="${x}" cy="${y}" r="9" fill="${c}" class="pulse"/>`:''}<circle cx="${x}" cy="${y}" r="${on?8:5}" fill="${c}" stroke="#fff" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="14" fill="transparent"/></g>`}).join('');
}
const order=[...EV].sort((a,b)=>a.era-b.era||a.yr-b.yr).map(e=>e.id);
function go(id){if(!BY[id])return;cur=id;render();try{history.replaceState(null,'','#'+id)}catch(_){}}
function step(d){const i=order.indexOf(cur);go(order[(i+d+order.length)%order.length])}

document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-id]');if(t){go(t.dataset.id);if(t.classList.contains('go')||t.classList.contains('mk')||innerWidth<900)$('#card').scrollIntoView({behavior:'smooth',block:'start'});return}
 const c=ev.target.closest('.chip');if(c){filt=c.dataset.t||null;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render();return}
 const l=ev.target.closest('[data-l]');if(l){document.body.className=l.dataset.l;document.querySelectorAll('[data-l]').forEach(x=>x.setAttribute('aria-pressed',x===l));try{localStorage.setItem('whl',l.dataset.l)}catch(_){}return}
 if(ev.target.id==='prev')step(-1);if(ev.target.id==='next')step(1);
 if(ev.target.id==='rev'){const a=$('#think .ans');a.hidden=!a.hidden;ev.target.setAttribute('aria-expanded',!a.hidden);ev.target.textContent=a.hidden?'看分析 Show reasoning':'收起 Hide'}
});
document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')step(1);if(ev.key==='ArrowLeft')step(-1)});
try{const s=localStorage.getItem('whl');if(s){document.querySelector(`[data-l="${s}"]`)?.click()}}catch(_){}
const h=location.hash.slice(1);if(BY[h])cur=h;
render();
}
</script>
</body>
</html>
